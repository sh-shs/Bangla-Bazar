<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Bangla Bazar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="page-top-bar">
    <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <span class="page-title">My Profile & Orders</span>
  </div>

  <div class="section-wrapper" style="max-width: 600px; margin: 0 auto;">
    <div class="glass-card" style="margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;">
      <div>
        <h3 id="profile-name" style="font-size: 1.1rem; color: var(--primary-color);">...</h3>
        <p id="profile-email" style="font-size: 0.85rem; color: var(--text-muted);">...</p>
        <span id="profile-role-badge" style="font-size: 0.7rem; background: var(--primary-light); color: var(--primary-color); padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase;">Customer</span>
      </div>
      <button id="logout-btn" class="btn-outline" style="color: var(--danger-color); border-color: var(--danger-color); font-size: 0.8rem; padding: 6px 12px;">Logout</button>
    </div>

    <!-- Orders Section -->
    <div class="glass-card">
      <h3 style="color: var(--primary-color); font-size: 1.05rem; margin-bottom: 14px;"><i class="fas fa-shopping-bag"></i> My Order History</h3>
      <div id="user-orders-list"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
    <a href="shop.html" class="nav-item">
      <i class="fas fa-th-large"></i>
      <span>Menu</span>
    </a>
    <a href="cart.html" class="center-cart-shortcut">
      <i class="fas fa-shopping-cart"></i>
    </a>
    <a href="shop.html" class="nav-item">
      <i class="fas fa-search"></i>
      <span>Search</span>
    </a>
    <a href="profile.html" class="nav-item active account-link">
      <i class="fas fa-user"></i>
      <span>Account</span>
    </a>
  </nav>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { onAuthStateUpdate, logoutUser } from './assets/js/auth.js';
    import { db, collection, getDocs, query, where } from './assets/js/firebase-config.js';
    import { generatePDFInvoice } from './assets/js/invoice.js';

    let currentOrders = [];

    window.downloadInvoiceHandler = (orderId) => {
      const order = currentOrders.find(o => o.id === orderId);
      if (order) generatePDFInvoice(order);
    };

    onAuthStateUpdate(async (user, profile) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('profile-name').textContent = profile?.displayName || user.displayName || 'Valued Customer';
      document.getElementById('profile-email').textContent = user.email || '';
      document.getElementById('profile-role-badge').textContent = profile?.role || 'Customer';

      // Load user orders
      const q = query(collection(db, 'orders'), where('userId', '==', user.uid));
      const snap = await getDocs(q);
      currentOrders = [];
      snap.forEach(d => currentOrders.push({ id: d.id, ...d.data() }));

      const container = document.getElementById('user-orders-list');
      if (currentOrders.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #777; padding: 20px;">No orders placed yet.</p>';
      } else {
        container.innerHTML = currentOrders.map(o => `
          <div style="background: #FFF; border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; margin-bottom: 6px;">
              <span>Order #${o.id.substring(0,6)}</span>
              <span style="color: var(--accent-color);">${o.orderStatus || 'Pending'}</span>
            </div>
            <div style="font-size: 0.8rem; color: #555; margin-bottom: 8px;">
              Items: ${o.items ? o.items.map(i => i.name).join(', ') : 'Products'}<br>
              Total: <strong>৳${o.totalAmount}</strong> | Method: ${o.paymentMethod?.toUpperCase()}
            </div>
            <button onclick="window.downloadInvoiceHandler('${o.id}')" class="btn-outline" style="font-size: 0.75rem; padding: 4px 10px; width: 100%;">
              <i class="fas fa-file-pdf"></i> Download PDF Invoice
            </button>
          </div>
        `).join('');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => logoutUser());
  </script>
</body>
</html>
