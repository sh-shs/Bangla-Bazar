<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard - Bangla Bazar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="page-top-bar">
    <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <span class="page-title">Seller Dashboard</span>
  </div>

  <div class="section-wrapper">
    <!-- Quick Metrics -->
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;">
      <div class="glass-card" style="text-align: center;">
        <i class="fas fa-box-open" style="font-size: 1.5rem; color: var(--primary-color);"></i>
        <div style="font-size: 1.2rem; font-weight: bold; margin-top: 4px;" id="stat-products-count">0</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">Total Products</div>
      </div>
      <div class="glass-card" style="text-align: center;">
        <i class="fas fa-shopping-bag" style="font-size: 1.5rem; color: var(--accent-color);"></i>
        <div style="font-size: 1.2rem; font-weight: bold; margin-top: 4px;" id="stat-orders-count">0</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">Vendor Orders</div>
      </div>
    </div>

    <!-- Tab Navigation -->
    <div style="display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px;">
      <button class="btn-primary" id="tab-btn-products" onclick="switchSellerTab('products')">My Products</button>
      <button class="btn-outline" id="tab-btn-orders" onclick="switchSellerTab('orders')">My Orders</button>
      <button class="btn-outline" id="tab-btn-add" onclick="switchSellerTab('add')">+ Add Product</button>
    </div>

    <!-- Tab 1: My Products -->
    <div id="tab-products">
      <div id="seller-products-list"></div>
    </div>

    <!-- Tab 2: My Orders -->
    <div id="tab-orders" style="display: none;">
      <div id="seller-orders-list"></div>
    </div>

    <!-- Tab 3: Add / Edit Product -->
    <div id="tab-add" style="display: none;">
      <div class="glass-card">
        <h3 style="color: var(--primary-color); font-size: 1.1rem; margin-bottom: 16px;" id="form-product-heading">Add New Product</h3>
        <form id="product-form">
          <input type="hidden" id="edit-product-id">

          <div class="form-group">
            <label class="form-label">Product Name *</label>
            <input type="text" id="p-name" class="form-control" required placeholder="e.g. Mens Cotton Shirt">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label class="form-label">Category *</label>
              <select id="p-category" class="form-control" required>
                <option value="electronics">Electronics</option>
                <option value="fashion">Fashion</option>
                <option value="home-living">Home & Living</option>
                <option value="kitchen">Kitchen</option>
                <option value="beauty">Beauty</option>
                <option value="health">Health</option>
                <option value="baby-care">Baby Care</option>
                <option value="sports">Sports</option>
                <option value="lighting">Lighting</option>
                <option value="gadgets">Gadgets</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Sub-Category</label>
              <input type="text" id="p-subcategory" class="form-control" placeholder="e.g. Shirts">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label class="form-label">Regular Price (৳) *</label>
              <input type="number" id="p-regular-price" class="form-control" required placeholder="1000">
            </div>
            <div class="form-group">
              <label class="form-label">Discount Price (৳)</label>
              <input type="number" id="p-discount-price" class="form-control" placeholder="850">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label class="form-label">Stock Quantity *</label>
              <input type="number" id="p-stock" class="form-control" required value="10">
            </div>
            <div class="form-group">
              <label class="form-label">SKU / Code</label>
              <input type="text" id="p-sku" class="form-control" placeholder="BB-101">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Short Description *</label>
            <input type="text" id="p-short-desc" class="form-control" required placeholder="Brief bullet features">
          </div>

          <div class="form-group">
            <label class="form-label">Full Description</label>
            <textarea id="p-full-desc" class="form-control" rows="4" placeholder="Detailed product specifications..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Product Images (Upload to Firebase Storage)</label>
            <input type="file" id="p-images-file" class="form-control" multiple accept="image/*">
            <div id="p-image-previews" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Product Video (Optional)</label>
            <input type="file" id="p-video-file" class="form-control" accept="video/*">
          </div>

          <div class="form-group">
            <label class="form-label">Variants (Color/Size comma separated)</label>
            <input type="text" id="p-variants" class="form-control" placeholder="e.g. Red, Blue, XL, M">
          </div>

          <button type="submit" id="save-p-btn" class="btn-accent" style="width: 100%; font-size: 1rem; padding: 12px; margin-top: 10px;">Publish Product</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { fetchMyProducts, fetchMyOrders, saveSellerProduct, deleteSellerProduct, uploadMediaFile } from './assets/js/seller.js';
    import { onAuthStateUpdate } from './assets/js/auth.js';
    import { showToast } from './assets/js/app.js';

    let currentSellerProducts = [];

    window.switchSellerTab = (tab) => {
      ['products', 'orders', 'add'].forEach(t => {
        document.getElementById(`tab-${t}`).style.display = t === tab ? 'block' : 'none';
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tab) {
          btn.className = 'btn-primary';
        } else {
          btn.className = 'btn-outline';
        }
      });
    };

    onAuthStateUpdate(async (user, profile) => {
      if (!user || !profile || profile.sellerStatus !== 'approved') {
        showToast('Seller Access Required');
        window.location.href = 'seller-register.html';
        return;
      }

      loadSellerDashboardData();
    });

    async function loadSellerDashboardData() {
      // Products
      currentSellerProducts = await fetchMyProducts();
      document.getElementById('stat-products-count').textContent = currentSellerProducts.length;
      const productsContainer = document.getElementById('seller-products-list');
      if (currentSellerProducts.length === 0) {
        productsContainer.innerHTML = '<p style="text-align: center; color: #777; padding: 20px;">No products uploaded yet.</p>';
      } else {
        productsContainer.innerHTML = currentSellerProducts.map(p => `
          <div style="display: flex; gap: 12px; background: #FFF; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; margin-bottom: 10px; align-items: center;">
            <img src="${p.images?.[0] || 'https://via.placeholder.com/60'}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 6px;">
            <div style="flex: 1;">
              <h4 style="font-size: 0.9rem; font-weight: 600;">${p.name}</h4>
              <div style="font-size: 0.8rem; color: var(--accent-color); font-weight: bold;">৳${p.discountPrice || p.regularPrice} | Stock: ${p.stock}</div>
            </div>
            <div style="display: flex; gap: 6px;">
              <button onclick="window.editProduct('${p.id}')" class="btn-outline" style="padding: 4px 8px; font-size: 0.75rem;"><i class="fas fa-edit"></i></button>
              <button onclick="window.deleteProductHandler('${p.id}')" style="background: var(--danger-color); color: #FFF; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem;"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `).join('');
      }

      // Orders
      const myOrders = await fetchMyOrders();
      document.getElementById('stat-orders-count').textContent = myOrders.length;
      const ordersContainer = document.getElementById('seller-orders-list');
      if (myOrders.length === 0) {
        ordersContainer.innerHTML = '<p style="text-align: center; color: #777; padding: 20px;">No orders received yet.</p>';
      } else {
        ordersContainer.innerHTML = myOrders.map(o => `
          <div class="glass-card" style="margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold;">
              <span>Order #${o.id.substring(0,6)}</span>
              <span style="color: var(--accent-color);">${o.orderStatus}</span>
            </div>
            <div style="font-size: 0.8rem; color: #555; margin-top: 4px;">Items: ${o.items.map(i => i.name).join(', ')}</div>
            <div style="font-size: 0.8rem; margin-top: 4px;">Customer: ${o.customerInfo?.name} (${o.customerInfo?.phone})</div>
          </div>
        `).join('');
      }
    }

    window.editProduct = (id) => {
      const p = currentSellerProducts.find(item => item.id === id);
      if (!p) return;
      document.getElementById('edit-product-id').value = p.id;
      document.getElementById('p-name').value = p.name || '';
      document.getElementById('p-category').value = p.category || 'electronics';
      document.getElementById('p-subcategory').value = p.subCategory || '';
      document.getElementById('p-regular-price').value = p.regularPrice || '';
      document.getElementById('p-discount-price').value = p.discountPrice || '';
      document.getElementById('p-stock').value = p.stock || 10;
      document.getElementById('p-sku').value = p.sku || '';
      document.getElementById('p-short-desc').value = p.shortDescription || '';
      document.getElementById('p-full-desc').value = p.fullDescription || '';
      document.getElementById('p-variants').value = p.variants ? p.variants.join(', ') : '';

      document.getElementById('form-product-heading').textContent = 'Edit Product';
      switchSellerTab('add');
    };

    window.deleteProductHandler = async (id) => {
      if (confirm('Are you sure you want to delete this product?')) {
        await deleteSellerProduct(id);
        showToast('Product Deleted');
        loadSellerDashboardData();
      }
    };

    // Product Form Submit
    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('save-p-btn');
      btn.disabled = true;
      btn.textContent = 'Uploading Media & Saving...';

      try {
        const pId = document.getElementById('edit-product-id').value || null;

        // Handle File Uploads
        const imageFiles = document.getElementById('p-images-file').files;
        const imageUrls = [];
        for (let i = 0; i < imageFiles.length; i++) {
          const url = await uploadMediaFile(imageFiles[i], 'products/images');
          imageUrls.push(url);
        }

        const videoFile = document.getElementById('p-video-file').files[0];
        let videoUrl = null;
        if (videoFile) {
          videoUrl = await uploadMediaFile(videoFile, 'products/videos');
        }

        const slug = document.getElementById('p-name').value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');

        const productPayload = {
          name: document.getElementById('p-name').value.trim(),
          category: document.getElementById('p-category').value,
          subCategory: document.getElementById('p-subcategory').value.trim(),
          regularPrice: Number(document.getElementById('p-regular-price').value),
          discountPrice: document.getElementById('p-discount-price').value ? Number(document.getElementById('p-discount-price').value) : null,
          stock: Number(document.getElementById('p-stock').value),
          sku: document.getElementById('p-sku').value.trim(),
          shortDescription: document.getElementById('p-short-desc').value.trim(),
          fullDescription: document.getElementById('p-full-desc').value.trim(),
          slug,
          status: 'published',
          variants: document.getElementById('p-variants').value ? document.getElementById('p-variants').value.split(',').map(s=>s.trim()) : []
        };

        if (imageUrls.length > 0) productPayload.images = imageUrls;
        else if (!pId) productPayload.images = ['https://via.placeholder.com/400?text=Bangla+Bazar'];

        if (videoUrl) productPayload.video = videoUrl;

        await saveSellerProduct(productPayload, pId);
        showToast('Product Saved Successfully!');
        document.getElementById('product-form').reset();
        document.getElementById('edit-product-id').value = '';
        switchSellerTab('products');
        loadSellerDashboardData();
      } catch (err) {
        showToast(err.message || 'Error saving product');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Publish Product';
      }
    });
  </script>
</body>
</html>
