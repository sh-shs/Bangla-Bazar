<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Become a Seller - Bangla Bazar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="page-top-bar">
    <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <span class="page-title">Seller Registration</span>
  </div>

  <div class="section-wrapper" style="max-width: 500px; margin: 0 auto;">
    <div class="glass-card">
      <h2 style="color: var(--primary-color); font-size: 1.3rem; margin-bottom: 8px;"><i class="fas fa-store"></i> Register as a Vendor</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Start selling your products to thousands of customers in Kushtia & Bangladesh!</p>

      <div id="seller-status-notice" style="display: none; padding: 12px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 16px;"></div>

      <form id="seller-reg-form">
        <div class="form-group">
          <label class="form-label">Store / Business Name *</label>
          <input type="text" id="store-name" class="form-control" required placeholder="e.g. Kushtia Fashion House">
        </div>

        <div class="form-group">
          <label class="form-label">Contact Mobile Number *</label>
          <input type="tel" id="seller-phone" class="form-control" required placeholder="017XXXXXXXX">
        </div>

        <div class="form-group">
          <label class="form-label">NID / Trade License Number *</label>
          <input type="text" id="seller-nid" class="form-control" required placeholder="National ID or Trade License">
        </div>

        <div class="form-group">
          <label class="form-label">Store / Warehouse Address *</label>
          <textarea id="seller-address" class="form-control" rows="3" required placeholder="Detailed location in Kushtia"></textarea>
        </div>

        <button type="submit" id="submit-seller-btn" class="btn-accent" style="width: 100%; font-size: 1rem; padding: 10px;">Submit Seller Request</button>
      </form>
    </div>
  </div>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { applyForSeller } from './assets/js/seller.js';
    import { currentUser, userProfile, onAuthStateUpdate } from './assets/js/auth.js';
    import { showToast } from './assets/js/app.js';

    onAuthStateUpdate((user, profile) => {
      if (!user) {
        showToast('Please login to apply as seller');
        window.location.href = 'login.html';
        return;
      }

      const notice = document.getElementById('seller-status-notice');
      const form = document.getElementById('seller-reg-form');

      if (profile && profile.sellerStatus === 'pending') {
        notice.style.display = 'block';
        notice.style.background = '#FFF3E0';
        notice.style.color = '#D96E00';
        notice.innerHTML = '<i class="fas fa-clock"></i> Your seller application is <strong>Pending Approval</strong> by Admin. You will be notified once approved.';
        form.style.display = 'none';
      } else if (profile && profile.sellerStatus === 'approved') {
        notice.style.display = 'block';
        notice.style.background = '#E8F5E9';
        notice.style.color = '#0B4D3C';
        notice.innerHTML = '<i class="fas fa-check-circle"></i> You are an <strong>Approved Seller</strong>! <a href="seller-dashboard.html" style="text-decoration: underline; font-weight: bold;">Go to Seller Dashboard</a>';
        form.style.display = 'none';
      }
    });

    document.getElementById('seller-reg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-seller-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      try {
        await applyForSeller(
          document.getElementById('store-name').value.trim(),
          document.getElementById('seller-phone').value.trim(),
          document.getElementById('seller-nid').value.trim(),
          document.getElementById('seller-address').value.trim()
        );
        showToast('Application Submitted! Pending Admin Approval.');
        window.location.reload();
      } catch (err) {
        showToast(err.message || 'Submission failed');
        btn.disabled = false;
        btn.textContent = 'Submit Seller Request';
      }
    });
  </script>
</body>
</html>
