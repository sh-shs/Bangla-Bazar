<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHS Bazar</title>
  <script>
    (function() {
      var pathname = window.location.pathname;
      var match = pathname.match(/\/(?:shs-bazar\/)?product\/([^\/\?#]+)/);
      if (match && match[1]) {
        var slug = match[1];
        var basePath = pathname.includes('/shs-bazar') ? '/shs-bazar' : '';
        window.location.replace(basePath + '/product-detail.html?slug=' + encodeURIComponent(slug));
      } else {
        var basePath = pathname.includes('/shs-bazar') ? '/shs-bazar' : '';
        window.location.replace(basePath + '/index.html');
      }
    })();
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px 20px; color: #333;">
  <p>Loading SHS Bazar...</p>
</body>
</html>
