<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - SHS Bazar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .order-status-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px 0;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .order-status-tabs::-webkit-scrollbar {
      display: none;
    }
    .status-tab {
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .status-tab.active {
      background: var(--primary-color);
      color: #FFFFFF;
      border-color: var(--primary-color);
      box-shadow: 0 4px 10px rgba(11, 77, 60, 0.25);
    }

    /* Review Modal Styles */
    .review-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .review-modal-overlay.active {
      display: flex;
    }
    .review-modal {
      background: var(--card-bg, #FFFFFF);
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
      border: 1px solid var(--border-color, #E2E8F0);
      padding: 20px;
    }
    .star-rating-select {
      display: flex;
      gap: 10px;
      font-size: 1.8rem;
      color: #D1D5DB;
      cursor: pointer;
      margin: 10px 0 16px 0;
    }
    .star-rating-select .fa-star.selected {
      color: #F59E0B;
    }
    .review-img-preview-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .review-img-thumb {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .review-img-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .review-img-thumb .remove-img-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(220, 38, 38, 0.85);
      color: #FFF;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <!-- Top Navigation Bar -->
  <div class="page-top-bar">
    <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <span class="page-title" data-i18n="myOrders">My Orders</span>
  </div>

  <div class="section-wrapper" style="max-width: 700px; margin: 0 auto;">
    <!-- Status Filter Tabs -->
    <div class="order-status-tabs" id="status-filter-tabs">
      <button class="status-tab active" data-status="all">All Orders</button>
      <button class="status-tab" data-status="pending">Pending</button>
      <button class="status-tab" data-status="processing">Processing</button>
      <button class="status-tab" data-status="shipped">Shipped</button>
      <button class="status-tab" data-status="delivered">Delivered</button>
      <button class="status-tab" data-status="cancelled">Cancelled</button>
    </div>

    <!-- Orders Container -->
    <div id="orders-list-container">
      <div style="text-align: center; color: var(--text-muted); padding: 40px 20px;" class="glass-card">
        <i class="fas fa-spinner fa-spin" style="font-size: 1.8rem; color: var(--primary-color);"></i>
        <p style="margin-top: 10px; font-size: 0.9rem;">Loading your order history...</p>
      </div>
    </div>
  </div>

<!-- Write Review Modal -->
<div class="review-modal-overlay" id="review-modal-overlay">
  <div class="review-modal">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
      <h3 style="font-size: 1.1rem; color: var(--text-primary); font-weight: 700; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-star" style="color: #F59E0B;"></i> Product Review
      </h3>
      <button onclick="window.closeReviewModal()" style="background: none; border: none; font-size: 1.4rem; color: var(--text-muted); cursor: pointer;">&times;</button>
    </div>

    <div id="review-modal-product-info" style="display: flex; gap: 12px; align-items: center; background: var(--bg-color); padding: 10px; border-radius: 10px; margin-bottom: 16px; border: 1px solid var(--border-color);">
      <img id="review-modal-img" src="" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;">
      <div>
        <div id="review-modal-title" style="font-weight: 700; font-size: 0.9rem; color: var(--text-primary);">Product Name</div>
        <div id="review-modal-order-id" style="font-size: 0.78rem; color: var(--text-muted);">Order #---</div>
      </div>
    </div>

    <form id="review-form">
      <input type="hidden" id="review-order-id">
      <input type="hidden" id="review-product-id">
      <input type="hidden" id="review-doc-id">
      <input type="hidden" id="review-rating-value" value="5">

      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" style="font-weight: 600; font-size: 0.88rem;">Select Rating *</label>
        <div class="star-rating-select" id="star-rating-container">
          <i class="fas fa-star selected" data-value="1"></i>
          <i class="fas fa-star selected" data-value="2"></i>
          <i class="fas fa-star selected" data-value="3"></i>
          <i class="fas fa-star selected" data-value="4"></i>
          <i class="fas fa-star selected" data-value="5"></i>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" style="font-weight: 600; font-size: 0.88rem;">Your Review / Comment *</label>
        <textarea id="review-comment" class="form-control" rows="4" required placeholder="Write your experience with this product..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-family: inherit; font-size: 0.88rem;"></textarea>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" style="font-weight: 600; font-size: 0.88rem;">Upload Product Photos (Optional, max 4)</label>
        <input type="file" id="review-photos-input" class="form-control" accept="image/*" multiple style="font-size: 0.82rem;">
        <div class="review-img-preview-grid" id="review-photos-preview"></div>
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button type="button" onclick="window.closeReviewModal()" class="btn-outline" style="padding: 10px 18px; border-radius: 8px;">Cancel</button>
        <button type="submit" id="review-submit-btn" class="btn-accent" style="padding: 10px 22px; border-radius: 8px; font-weight: 700;">Submit Review</button>
      </div>
    </form>
  </div>
</div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <div class="nav-icon-wrap"><i class="fas fa-home"></i></div>
      <span data-i18n="home">Home</span>
    </a>
    <a href="shop.html" class="nav-item">
      <div class="nav-icon-wrap"><i class="fas fa-th-large"></i></div>
      <span data-i18n="allCategories">Menu</span>
    </a>
    <div class="center-cart-wrapper">
      <a href="cart.html" class="center-cart-shortcut" aria-label="Cart">
        <i class="fas fa-shopping-cart"></i>
        <span class="nav-cart-badge cart-count-badge">0</span>
      </a>
    </div>
        <a href="shop.html" class="nav-item">
      <div class="nav-icon-wrap"><i class="fas fa-search"></i></div>
      <span data-i18n="search">Search</span>
    </a>
    <a href="profile.html" class="nav-item account-link">
      <div class="nav-icon-wrap"><i class="fas fa-user"></i></div>
      <span data-i18n="myAccount">Account</span>
    </a>
  </nav>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    import { onAuthStateUpdate } from './assets/js/auth.js';
    import { db, collection, getDocs, doc, setDoc, addDoc, query, where } from './assets/js/firebase-config.js';
    import { generatePDFInvoice } from './assets/js/invoice.js';
    import { uploadMediaFile } from './assets/js/admin.js';
    import { showToast } from './assets/js/app.js';

    let allOrders = [];
    let activeFilter = 'all';
    let currentUserObj = null;
    let currentUserProfile = null;
    let existingUserReviews = {}; // Key: `${order_id}_${product_id}` -> review doc
    let pendingUploadPhotos = [];
    let existingReviewImageUrls = [];

    window.downloadInvoiceHandler = (orderId) => {
      const order = allOrders.find(o => o.id === orderId);
      if (order) generatePDFInvoice(order);
    };

    window.toggleOrderDetail = (orderId) => {
      const detailEl = document.getElementById(`order-details-${orderId}`);
      const iconEl = document.getElementById(`order-toggle-icon-${orderId}`);
      if (!detailEl) return;
      if (detailEl.style.display === 'none' || !detailEl.style.display) {
        detailEl.style.display = 'block';
        if (iconEl) iconEl.className = 'fas fa-chevron-up';
      } else {
        detailEl.style.display = 'none';
        if (iconEl) iconEl.className = 'fas fa-chevron-down';
      }
    };

    function formatOrderDate(createdAt) {
      if (!createdAt) return 'N/A';
      if (createdAt.seconds) {
        return new Date(createdAt.seconds * 1000).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
      }
      return new Date(createdAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
    }

    function getBadgeClass(status) {
      const s = (status || 'Pending').toLowerCase().replace(/\s+/g, '-');
      return `admin-badge admin-badge-${s}`;
    }

    function renderOrders() {
      const container = document.getElementById('orders-list-container');
      if (!container) return;

      const filtered = activeFilter === 'all'
        ? allOrders
        : allOrders.filter(o => (o.orderStatus || 'Pending').toLowerCase() === activeFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="glass-card" style="text-align: center; padding: 36px 20px;">
            <div style="font-size: 3rem; color: var(--text-muted); margin-bottom: 12px;">
              <i class="fas fa-box-open"></i>
            </div>
            <h3 style="font-size: 1.1rem; color: var(--text-primary); margin-bottom: 8px;">No ${activeFilter === 'all' ? '' : activeFilter} orders found</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px;">Place your order now to enjoy discount deals inside Kushtia!</p>
            <a href="shop.html" class="btn-accent" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 10px 22px; border-radius: 25px; font-weight: bold;">
              <i class="fas fa-shopping-bag"></i> Start Shopping Now
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(o => {
        const items = Array.isArray(o.items) ? o.items : [];
        const status = o.orderStatus || 'Pending';
        const badgeClass = getBadgeClass(status);
        const dateStr = formatOrderDate(o.createdAt);
        const totalPaid = Number(o.totalAmount || 0).toLocaleString('bn-BD');
        const paymentMethod = (o.paymentMethod || 'COD').toUpperCase();

        const itemsSummaryText = items.length > 0
          ? items.slice(0, 2).map(i => `${i.name || 'Product'} (x${i.quantity || 1})`).join(', ') + (items.length > 2 ? ` + ${items.length - 2} more` : '')
          : 'Product details';

        const isDelivered = (status || '').toLowerCase() === 'delivered';

        const itemsDetailHTML = items.map(item => {
          const productId = item.id || item.productId || '';
          const reviewKey = `${o.id}_${productId}`;
          const review = existingUserReviews[reviewKey];

          const reviewButtonHTML = isDelivered && productId ? `
            <div style="margin-top: 6px;">
              <button onclick="window.openReviewModal('${o.id}', '${productId}', '${(item.name || '').replace(/'/g, "\\'")}', '${item.image || (item.images && item.images[0]) || ''}')"
                class="${review ? 'btn-outline' : 'btn-accent'}"
                style="font-size: 0.75rem; padding: 5px 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; text-decoration: none;">
                <i class="fas fa-star" style="color: #F59E0B;"></i> ${review ? 'Edit Review' : 'Write a Review'}
              </button>
            </div>
          ` : '';

          return `
            <div style="display: flex; gap: 10px; align-items: center; background: var(--bg-color); padding: 8px; border-radius: 6px; margin-bottom: 6px; border: 1px solid var(--border-color);">
              <img src="${item.image || (item.images && item.images[0]) || 'https://via.placeholder.com/50'}" alt="${item.name || 'Item'}" style="width: 44px; height: 44px; object-fit: cover; border-radius: 4px;">
              <div style="flex: 1;">
                <div style="font-weight: 600; font-size: 0.85rem; color: var(--text-primary);">${item.name || 'Unnamed Product'}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">
                  ৳${Number(item.price || 0).toLocaleString('bn-BD')} × ${item.quantity || 1}
                  ${item.variant ? ` | <span style="color: var(--accent-color); font-weight: 600;">Variant: ${item.variant}</span>` : ''}
                </div>
                ${reviewButtonHTML}
              </div>
              <div style="font-weight: 700; color: var(--primary-color); font-size: 0.88rem;">৳${(Number(item.price || 0) * Number(item.quantity || 1)).toLocaleString('bn-BD')}</div>
            </div>
          `;
        }).join('');

        const subtotal = Number(o.subtotal || items.reduce((s, i) => s + (Number(i.price || 0) * Number(i.quantity || 1)), 0));
        const deliveryCharge = Number(o.deliveryCharge || 0);
        const discountAmount = Number(o.discountAmount || 0);

        return `
          <div class="glass-card" style="margin-bottom: 14px; padding: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; flex-wrap: wrap; gap: 6px;">
              <div>
                <span style="font-weight: 800; font-size: 0.95rem; color: var(--primary-color);">Order #${o.id}</span>
                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;"><i class="far fa-clock"></i> ${dateStr}</div>
              </div>
              <span class="${badgeClass}">${status}</span>
            </div>

            <div style="font-size: 0.82rem; color: var(--text-primary); margin-bottom: 12px; background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);">
              <div><strong>Items:</strong> ${itemsSummaryText}</div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
                <span><strong>Total:</strong> <span style="color: var(--primary-color); font-weight: 800; font-size: 0.95rem;">৳${totalPaid}</span> (${paymentMethod})</span>
              </div>
            </div>

            <div style="display: flex; gap: 8px; align-items: center;">
              <button onclick="window.toggleOrderDetail('${o.id}')" class="btn-outline" style="flex: 1; font-size: 0.8rem; padding: 8px 12px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                <i class="fas fa-list"></i> Order Details <i id="order-toggle-icon-${o.id}" class="fas fa-chevron-down" style="font-size: 0.7rem;"></i>
              </button>
              <button onclick="window.downloadInvoiceHandler('${o.id}')" class="btn-accent" style="flex: 1; font-size: 0.8rem; padding: 8px 12px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                <i class="fas fa-file-pdf"></i> Download Invoice
              </button>
            </div>

            <div id="order-details-${o.id}" style="display: none; margin-top: 14px; border-top: 1px dashed var(--border-color); padding-top: 14px;">
              <h4 style="font-size: 0.85rem; color: var(--primary-color); font-weight: 700; margin-bottom: 8px;"><i class="fas fa-box"></i> Order Items (${items.length})</h4>
              <div style="margin-bottom: 12px;">
                ${itemsDetailHTML}
              </div>

              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; font-size: 0.8rem;">
                <div style="background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);">
                  <strong style="color: var(--primary-color); display: block; margin-bottom: 4px;"><i class="fas fa-map-marker-alt"></i> Delivery Address</strong>
                  <div><strong>Division:</strong> ${o.shippingAddress?.division || 'N/A'}</div>
                  <div><strong>District:</strong> ${o.shippingAddress?.district || 'N/A'}</div>
                  <div><strong>Upazila:</strong> ${o.shippingAddress?.thana || o.shippingAddress?.upazila || 'N/A'}</div>
                  <div><strong>Address:</strong> ${o.shippingAddress?.village || 'N/A'}</div>
                  ${o.shippingAddress?.notes ? `<div style="margin-top:2px; font-style:italic; color:var(--text-muted);">Notes: ${o.shippingAddress.notes}</div>` : ''}
                </div>

                <div style="background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);">
                  <strong style="color: var(--primary-color); display: block; margin-bottom: 4px;"><i class="fas fa-credit-card"></i> Payment Breakdown</strong>
                  <div><strong>Method:</strong> ${paymentMethod}</div>
                  ${o.bKashTxnId ? `<div style="color: #D84315; font-weight: 700; margin-top: 2px;">bKash TrxID: ${o.bKashTxnId}</div>` : ''}
                  <div style="margin-top: 6px; border-top: 1px solid var(--border-color); padding-top: 6px;">
                    <div>Subtotal: ৳${subtotal.toLocaleString('bn-BD')}</div>
                    ${discountAmount > 0 ? `<div style="color: #059669;">Discount: -৳${discountAmount.toLocaleString('bn-BD')}</div>` : ''}
                    <div>Delivery: ৳${deliveryCharge.toLocaleString('bn-BD')}</div>
                    <div style="font-weight: 800; color: var(--primary-color); font-size: 0.9rem; margin-top: 4px;">
                      Grand Total: ৳${totalPaid}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Tab Event Listeners
    document.querySelectorAll('#status-filter-tabs .status-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('#status-filter-tabs .status-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        activeFilter = e.target.getAttribute('data-status');
        renderOrders();
      });
    });

    // Review Modal Functions
    window.openReviewModal = (orderId, productId, productName, productImage) => {
      const modal = document.getElementById('review-modal-overlay');
      if (!modal) return;

      document.getElementById('review-order-id').value = orderId;
      document.getElementById('review-product-id').value = productId;
      document.getElementById('review-modal-title').textContent = productName;
      document.getElementById('review-modal-order-id').textContent = `Order #${orderId}`;
      document.getElementById('review-modal-img').src = productImage || 'https://via.placeholder.com/50';

      const reviewKey = `${orderId}_${productId}`;
      const existingRev = existingUserReviews[reviewKey];

      pendingUploadPhotos = [];
      existingReviewImageUrls = existingRev && Array.isArray(existingRev.images) ? [...existingRev.images] : [];

      if (existingRev) {
        document.getElementById('review-doc-id').value = existingRev.id || '';
        document.getElementById('review-comment').value = existingRev.comment || existingRev.review || '';
        setRatingValue(existingRev.rating || 5);
      } else {
        document.getElementById('review-doc-id').value = '';
        document.getElementById('review-comment').value = '';
        setRatingValue(5);
      }

      renderPhotoPreviews();
      modal.classList.add('active');
    };

    window.closeReviewModal = () => {
      const modal = document.getElementById('review-modal-overlay');
      if (modal) modal.classList.remove('active');
    };

    function setRatingValue(val) {
      document.getElementById('review-rating-value').value = val;
      const stars = document.querySelectorAll('#star-rating-container .fa-star');
      stars.forEach(s => {
        const starVal = parseInt(s.getAttribute('data-value'), 10);
        if (starVal <= val) {
          s.classList.add('selected');
        } else {
          s.classList.remove('selected');
        }
      });
    }

    // Star Rating Event Listeners
    document.querySelectorAll('#star-rating-container .fa-star').forEach(star => {
      star.addEventListener('click', (e) => {
        const val = parseInt(e.target.getAttribute('data-value'), 10);
        setRatingValue(val);
      });
    });

    // File Input Listener for Reviews
    const photoInput = document.getElementById('review-photos-input');
    if (photoInput) {
      photoInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files || []);
        const totalAllowed = 4 - existingReviewImageUrls.length;
        if (files.length > totalAllowed) {
          showToast(`Maximum 4 photos allowed in total.`);
        }
        pendingUploadPhotos = files.slice(0, totalAllowed);
        renderPhotoPreviews();
      });
    }

    function renderPhotoPreviews() {
      const container = document.getElementById('review-photos-preview');
      if (!container) return;

      let html = '';

      // Render existing saved images
      existingReviewImageUrls.forEach((url, idx) => {
        html += `
          <div class="review-img-thumb">
            <img src="${url}">
            <button type="button" class="remove-img-btn" onclick="window.removeExistingReviewImg(${idx})">&times;</button>
          </div>
        `;
      });

      // Render newly selected files
      pendingUploadPhotos.forEach((file, idx) => {
        const tempUrl = URL.createObjectURL(file);
        html += `
          <div class="review-img-thumb">
            <img src="${tempUrl}">
            <button type="button" class="remove-img-btn" onclick="window.removePendingReviewImg(${idx})">&times;</button>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    window.removeExistingReviewImg = (idx) => {
      existingReviewImageUrls.splice(idx, 1);
      renderPhotoPreviews();
    };

    window.removePendingReviewImg = (idx) => {
      pendingUploadPhotos.splice(idx, 1);
      renderPhotoPreviews();
    };

    // Form Submit Listener
    document.getElementById('review-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('review-submit-btn');

      const orderId = document.getElementById('review-order-id').value;
      const productId = document.getElementById('review-product-id').value;
      const docId = document.getElementById('review-doc-id').value;
      const rating = parseInt(document.getElementById('review-rating-value').value, 10) || 5;
      const comment = document.getElementById('review-comment').value.trim();

      if (!currentUserObj) {
        showToast('Please login to submit a review');
        return;
      }

      if (!comment) {
        showToast('Please write a comment for your review');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

      try {
        let uploadedUrls = [...existingReviewImageUrls];

        if (pendingUploadPhotos.length > 0) {
          const uploads = pendingUploadPhotos.map(file => uploadMediaFile(file, 'reviews'));
          const newUrls = await Promise.all(uploads);
          uploadedUrls = uploadedUrls.concat(newUrls.filter(Boolean));
        }

        const customerName = currentUserProfile?.displayName || currentUserObj.displayName || 'Customer';
        const customerEmail = currentUserObj.email || '';

        const reviewPayload = {
          product_id: productId,
          productId: productId,
          order_id: orderId,
          orderId: orderId,
          customer_id: currentUserObj.uid,
          userId: currentUserObj.uid,
          customer_name: customerName,
          customer_email: customerEmail,
          userName: customerName,
          userEmail: customerEmail,
          rating: rating,
          comment: comment,
          images: uploadedUrls,
          status: 'approved',
          isApproved: true,
          createdAt: new Date(),
          timestamp: new Date()
        };

        if (docId) {
          await setDoc(doc(db, 'reviews', docId), reviewPayload, { merge: true });
        } else {
          const docRef = await addDoc(collection(db, 'reviews'), reviewPayload);
          reviewPayload.id = docRef.id;
        }

        // Update local state
        const key = `${orderId}_${productId}`;
        existingUserReviews[key] = reviewPayload;

        showToast('Review submitted successfully!');
        window.closeReviewModal();
        renderOrders();
      } catch (err) {
        console.error('Error submitting review:', err);
        showToast('Failed to submit review. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Review';
      }
    });

    onAuthStateUpdate(async (user, profile) => {
      const container = document.getElementById('orders-list-container');
      currentUserObj = user;
      currentUserProfile = profile;

      if (!user) {
        container.innerHTML = `
          <div class="glass-card" style="text-align: center; padding: 36px 20px;">
            <div style="font-size: 3rem; color: var(--accent-color); margin-bottom: 12px;">
              <i class="fas fa-user-lock"></i>
            </div>
            <h3 style="font-size: 1.15rem; color: var(--text-primary); margin-bottom: 6px;">Please Login to View Orders</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Log in with your account to track order status and download invoices.</p>
            <a href="login.html" class="btn-primary" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 10px 24px; border-radius: 25px; font-weight: bold;">
              <i class="fas fa-sign-in-alt"></i> Login / Register
            </a>
          </div>
        `;
        return;
      }

      try {
        const q = query(collection(db, 'orders'), where('userId', '==', user.uid));
        const snap = await getDocs(q);
        allOrders = [];
        snap.forEach(d => allOrders.push({ id: d.id, ...d.data() }));

        allOrders.sort((a, b) => {
          const timeA = a.createdAt?.seconds ? a.createdAt.seconds * 1000 : (a.createdAt || 0);
          const timeB = b.createdAt?.seconds ? b.createdAt.seconds * 1000 : (b.createdAt || 0);
          return timeB - timeA;
        });

        // Fetch existing reviews for this user
        existingUserReviews = {};
        try {
          const revQuery = query(collection(db, 'reviews'), where('userId', '==', user.uid));
          const revSnap = await getDocs(revQuery);
          revSnap.forEach(d => {
            const data = d.data();
            const key = `${data.order_id || data.orderId}_${data.product_id || data.productId}`;
            existingUserReviews[key] = { id: d.id, ...data };
          });
        } catch (rErr) {
          console.warn('Error fetching user reviews:', rErr);
        }

        renderOrders();
      } catch (err) {
        console.error('Error fetching orders:', err);
        container.innerHTML = `
          <div class="glass-card" style="text-align: center; color: var(--danger-color); padding: 30px;">
            <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 10px;"></i>
            <p style="font-size: 0.9rem;">Unable to load orders. Please try again later.</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
